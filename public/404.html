<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — INTLLM</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://intllm.vercel.app/" />

  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/assets/ico/INTLLM.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="256x256" href="/assets/png/INTLLM-icon-256.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="/css/site.css" />

  <script>
    (function () {
      try {
        var stored = localStorage.getItem("intllm-theme");
        var theme = stored === "dark" || stored === "light"
          ? stored
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) { /* no storage; default stays light */ }
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/" aria-label="INTLLM home">
        <img class="logo logo-light" src="/assets/svg/INTLLM-logo.svg" alt="INTLLM" width="109" height="28" />
        <img class="logo logo-dark" src="/assets/svg/INTLLM-logo-white.svg" alt="" width="109" height="28" />
      </a>
    </div>
  </header>

  <main id="main">
    <div class="container">
      <div class="error-page">
        <span class="code" aria-hidden="true">404</span>
        <h1>Page not found</h1>
        <p>The page you are looking for does not exist on this site.</p>
        <div class="hero-ctas">
          <a class="btn btn--primary" href="/">Go home</a>
          <a class="btn btn--secondary" href="/info">Info</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <span>© 2026 Al Shahriar Sowan · MIT License</span>
        <span><a href="https://github.com/Alshahriar-07/INTLLM" rel="noopener noreferrer">GitHub</a> · v1.0.1</span>
      </div>
    </div>
  </footer>

  <script src="/js/site.js" defer></script>
</body>
</html>
